[package]
name = "openslate-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# tokio/process is needed for stdio MCP transports and the shell builtin.
tokio = { workspace = true, features = ["process"] }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
# mpsc channels for the in-process builtin MCP transports.
futures = { workspace = true }
# MCP deps: client role + stdio/HTTP transports for external servers (rmcp,
# reqwest). reqwest inherits the workspace declaration (default-features=false,
# json+rustls+stream); rmcp likewise pulls only the features listed in the
# workspace root.
reqwest = { workspace = true }
rmcp = { workspace = true }
# In-process builtin MCP servers (read_file / write_file / shell / edit_file).
openslate-mcp-builtin = { path = "../openslate-mcp-builtin" }

[dev-dependencies]
tempfile = { workspace = true }
rmcp = { workspace = true }
