[package]
name = "openslate-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
toml = { workspace = true }
# Format-preserving config write-back (config/persist.rs).
toml_edit = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# tokio/process is needed for stdio MCP transports and the shell builtin.
tokio = { workspace = true, features = ["process"] }
# CancellationToken threaded into execute_run for graceful cancellation (Phase 4).
tokio-util = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
# mpsc channels for the in-process builtin MCP transports.
futures = { workspace = true }
# MCP deps: client role + stdio/HTTP transports for external servers (rmcp,
# reqwest). reqwest inherits the workspace declaration (default-features=false,
# json+rustls+stream); rmcp likewise pulls only the features listed in the
# workspace root.
reqwest = { workspace = true }
http = "1"
rmcp = { workspace = true }
# In-process builtin MCP servers (read_file / write_file / shell / edit_file).
openslate-mcp-builtin = { path = "../openslate-mcp-builtin" }
# Programmatic Tool Calling (PTC): ToolCallMode enum shared by [ptc] config
# and the sandbox executor (see PTC_PLAN.md).
openslate-ptc = { workspace = true }

# Android：rustls-platform-verifier 需要 JNI 宿主初始化（纯 .so 场景不可
# 满足，未初始化即 panic）。provider::list_remote_models 的直连 reqwest
# 与 model-genai 同款：webpki 静态根证书预配置 TLS。
[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "tls12"] }
webpki-roots = "0.26"

[dev-dependencies]
tempfile = { workspace = true }
rmcp = { workspace = true }
