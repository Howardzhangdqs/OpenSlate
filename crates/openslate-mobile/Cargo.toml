[package]
name = "openslate-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenSlate mobile runtime composition (Android host; transport-independent, testable on desktop)"

[dependencies]
openslate-core = { path = "../openslate-core" }
openslate-app = { path = "../openslate-app" }
openslate-protocol = { path = "../openslate-protocol" }
openslate-session = { path = "../openslate-session" }
openslate-store-sqlite = { path = "../openslate-store-sqlite" }
# shell/bash 内置 server 的进程级环境注入源注册表（ask_user secret env
# 形态；mobile 装配期 set，mcp-builtin spawn 时取）。
openslate-mcp-builtin = { path = "../openslate-mcp-builtin" }
anyhow = { workspace = true }
tracing = { workspace = true }
# TranscriptFlusher 实现的 BoxFuture 类型名（历史转写丢失修复 C1）。
futures = { workspace = true }
# bootstrap 的 [database] path 原地改写（保持其余注释/格式零扰动）。
toml_edit = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
# 仅为注册原始 usage 诊断钩子（genai::chat::set_raw_usage_logger → logcat）。
genai = { path = "../../vendor/genai" }
# 模型元数据注册表本地存储压缩（数据源页面 / registry 模块）。
zstd = "0.13"
# 长输出落盘的 seekable 分块压缩（output_storer 写 / output_range 窗口
# 读；纯 Rust，底层 zstd-safe 与 zstd 0.13 的 zstd-sys 统一解析，无
# links 冲突）。
zeekstd = "0.6"
serde = { workspace = true }
# 附件 content-addressing 哈希（attachments 模块，存储 v5 §3）。
sha2 = "0.10"
# 附件图像归一化（解码 / 缩放 / JPEG q85 重编码；纯 Rust codec，
# Android 交叉编译无 C 依赖——default-features=false 只带所需四格式）。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# 缩略图出口 base64（attachment_thumbnail_base64 → FFI JSON）。
base64 = "0.22"
# output_query 工具的 grep 算子（纯 Rust；lock 内已有 regex→memchr 传递闭包）。
regex = "1"

[target.'cfg(target_os = "android")'.dependencies]

[dev-dependencies]
tempfile = { workspace = true }
openslate-model-genai = { path = "../openslate-model-genai" }
# 集成测试：附件 ingest / registry 种子数据压缩 / 异步断言。
tokio = { workspace = true, features = ["macros", "rt", "time"] }
