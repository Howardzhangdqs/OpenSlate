[package]
name = "openslate-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenSlate mobile runtime composition (Android host; transport-independent, testable on desktop)"

[dependencies]
openslate-core = { path = "../openslate-core" }
openslate-app = { path = "../openslate-app" }
openslate-protocol = { path = "../openslate-protocol" }
openslate-session = { path = "../openslate-session" }
openslate-store-sqlite = { path = "../openslate-store-sqlite" }
anyhow = { workspace = true }
tracing = { workspace = true }
# bootstrap 的 [database] path 原地改写（保持其余注释/格式零扰动）。
toml_edit = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
# 仅为注册原始 usage 诊断钩子（genai::chat::set_raw_usage_logger → logcat）。
genai = { path = "../../vendor/genai" }

[dev-dependencies]
tempfile = { workspace = true }
openslate-model-genai = { path = "../openslate-model-genai" }
