[package]
name = "openslate-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openslate"
path = "src/main.rs"

[dependencies]
openslate-core = { path = "../openslate-core" }
openslate-store-sqlite = { path = "../openslate-store-sqlite" }
# Shared application wiring (config/store/agents/skills/MCP/RunManager
# assembly + provider construction + approval policy derivation), extracted
# from this crate's former `wiring` module in P2a.
openslate-app = { path = "../openslate-app" }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
rustyline = "18"
indicatif = { workspace = true }
# Local-time formatting for the tracing timestamp.
chrono = { workspace = true }
# Markdown → ANSI rendering for model output on stdout. No Ratatui dependency;
# coexists with indicatif (spinner) and rustyline (REPL input).
termimad = "0.35"
# Syntax highlighting for fenced code blocks (the engine `bat` uses). Pure-Rust
# build (fancy-regex, no oniguruma C dep) to match the project's no-native-deps
# (rustls) philosophy.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[dev-dependencies]
tempfile = { workspace = true }
# Implementing ModelProvider for scripted test providers (compact summary
# path tests).
async-trait = { workspace = true }
