[package]
name = "openslate-mobile-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UniFFI FFI surface of the OpenSlate mobile runtime (Android/Kotlin host)"

[lib]
crate-type = ["cdylib", "lib"]
name = "openslate_mobile"
# doctest 关闭（L6 验证时定位）：本 crate 的 lib 名与依赖
# `openslate-mobile` 的 lib 目标同名（uniffi 脚手架要求），rustdoc
# --test 会收到两条同名 `--extern openslate_mobile`（自身 lib 的
# deps/ 软链 + 依赖的哈希 rlib）→ E0464 multiple candidates，
# 挂载即编译失败（与文件内容无关，HEAD 即复现）。本 crate 无
# runnable doctest（模块文档均为 //!，无代码围栏示例），关闭零损失。
doctest = false

[dependencies]
openslate-mobile = { path = "../openslate-mobile" }
uniffi = { version = "0.32", features = ["build"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# bindgen 二进制（`cargo run -p openslate-mobile-ffi --features bindgen --bin uniffi-bindgen`）。
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]
