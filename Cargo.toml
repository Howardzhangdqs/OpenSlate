[workspace]
resolver = "2"
members = [
    "crates/openslate-core",
    "crates/openslate-store-sqlite",
    "crates/openslate-model-openai",
    "crates/openslate-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.51", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }

# Serialization
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.148"
serde_yml = "0.0.12"
toml = "0.8"

# Error handling
thiserror = "2.0.17"
anyhow = "1.0.101"

# Logging / Tracing
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# SQLite (async)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Async trait
async-trait = "0.1"

# Testing
mockito = "1"

# Utilities
uuid = { version = "1.23.0", features = ["v4"] }
chrono = { version = "0.4.43", features = ["serde"] }
sha2 = "0.10"
dirs = "5"
tempfile = "3.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
