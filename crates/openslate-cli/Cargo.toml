[package]
name = "openslate-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "openslate"
path = "src/main.rs"

[dependencies]
openslate-core = { path = "../openslate-core" }
openslate-store-sqlite = { path = "../openslate-store-sqlite" }
# The genai-backed multi-provider adapter — the sole provider implementation
# (OpenAI-compatible, Anthropic, Gemini, Ollama all routed via genai).
openslate-model-genai = { path = "../openslate-model-genai" }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
dirs = { workspace = true }
rustyline = "18"
indicatif = { workspace = true }
# Local-time formatting for the tracing timestamp.
chrono = { workspace = true }
# Auto-load .env from the openslate.toml directory (KEY=VALUE; does not override
# existing env vars, so shell exports take precedence).
dotenvy = "0.15"
# Markdown → ANSI rendering for model output on stdout. No Ratatui dependency;
# coexists with indicatif (spinner) and rustyline (REPL input).
termimad = "0.35"
# Syntax highlighting for fenced code blocks (the engine `bat` uses). Pure-Rust
# build (fancy-regex, no oniguruma C dep) to match the project's no-native-deps
# (rustls) philosophy.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[features]
# MCP client support (rmcp + reqwest + tokio/process). The genai provider is
# always enabled (sole implementation); MCP is optional so `--no-default-features`
# yields a minimal binary (then `[mcp.*]` config fails at run time with a clear
# rebuild hint).
default = ["mcp"]
mcp = ["openslate-core/mcp"]

[dev-dependencies]
tempfile = { workspace = true }
