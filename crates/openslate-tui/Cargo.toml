[package]
name = "openslate-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openslate-tui"
path = "src/main.rs"

[dependencies]
openslate-core = { path = "../openslate-core" }
# web-1 shared wire contract: ClientMsg/ServerMsg + DTOs (the TUI is a
# pure client; the server owns engine + session + config persistence).
openslate-protocol = { path = "../openslate-protocol" }
# TUI framework (pinned =0.30.2 workspace-wide, see root Cargo.toml).
ratatui = { workspace = true }
# Terminal backend; must stay version-aligned with ratatui's backend
# (event-stream enables the async EventStream used in the main select! loop).
crossterm = { workspace = true }
# StreamExt for the crossterm EventStream.
tokio-stream = { workspace = true }
tokio = { workspace = true }
# web-1: WebSocket client transport (--server attach).
tokio-tungstenite = { workspace = true }
# Splitting the WS stream + driving the sink in the writer task.
futures-util = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
# File logging to ~/.local/share/openslate/logs/tui.log (env-filter driven).
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["env"] }
# ApprovalRequest argument summaries + message JSON handling.
serde_json = { workspace = true }
# Local-time formatting for log timestamps.
chrono = { workspace = true }
# XDG data-dir resolution for the log file location.
dirs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Implementing ModelProvider for the scripted e2e provider.
async-trait = { workspace = true }
# In-process real server for the #[ignore] end-to-end attach test.
openslate-server = { path = "../openslate-server" }
