[workspace]
resolver = "2"
members = [
    "crates/openslate-core",
    "crates/openslate-store-sqlite",
    "crates/openslate-model-openai",
    "crates/openslate-model-genai",
    "crates/openslate-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.51", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }

# Serialization
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.148"
serde_yml = "0.0.13"
toml = "0.9"

# Error handling
thiserror = "2.0.17"
anyhow = "1.0.101"

# Logging / Tracing
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }

# MCP client (Model Context Protocol). Only client role + stdio/HTTP transports;
# server/macros/base64 defaults excluded. reqwest tls feature stays rustls-only
# (see transport-streamable-http-client-reqwest: pulls __reqwest w/o tls feature).
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

# SQLite (async)
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite-bundled"] }

# Async trait
async-trait = "0.1"

# Testing
mockito = "1"

# Utilities
uuid = { version = "1.23.0", features = ["v4"] }
chrono = { version = "0.4.43", features = ["serde"] }
sha2 = "0.11"
dirs = "6"
indicatif = "0.18"
tempfile = "3.22"
futures-util = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
