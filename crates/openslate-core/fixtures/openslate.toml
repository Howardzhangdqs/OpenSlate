# OpenSlate Example Configuration
# This is the canonical example used by tests.

[project]
name = "example-openslate-project"

[database]
wal = true
busy_timeout_ms = 5000

[prompts]
path = "./prompts"
default_profile = "default"
hot_reload = true

[limits]
max_steps = 12
max_depth = 4
max_tool_calls = 20
max_child_agent_calls = 10
timeout_ms = 60000
max_context_messages = 64
max_context_bytes = 64000
max_output_bytes = 32000
# Auto-compact the history (LLM summary via the "fast" model, mechanical
# fallback when unavailable) once it crosses the context limits. /compact
# works regardless of this flag.
auto_compact = true
# Direct tool calls within one step run concurrently (default true). Batches
# containing call_agent/run_code always run sequentially. Set false to restore
# the fully sequential tool loop (e.g. for order-sensitive write→read chains).
parallel_tool_calls = true

[providers.zhipu]
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key_env = "ZHIPU_API_KEY"
# Retry policy for transient failures (HTTP 429/5xx, network errors):
# max_attempts = total attempts per call including the first (default 3);
# retry_base_ms = exponential backoff base in ms
# (delay = retry_base_ms * 2^(attempt-1) + jitter, single sleep capped at 10s).
max_attempts = 3
retry_base_ms = 500

# [providers.minimax] keeps the retry defaults (max_attempts = 3,
# retry_base_ms = 500) by omitting the fields.
[providers.minimax]
base_url = "https://api.minimax.chat/v1"
api_key_env = "MINIMAX_API_KEY"

[models.main]
provider = "zhipu"
model = "glm-5.1"
max_context_tokens = 200000
max_output_tokens = 8192
supports_tool_call = true
supports_reasoning = true
# Cost tracking (P2-3): standard prices in USD per million tokens.
# Absent fields price that side at 0; with neither set a run reports
# "pricing not configured". v1 prices standard input/output only —
# cache-read discounts are a known limitation.
# input_price_per_mtok = 0.5
# output_price_per_mtok = 2.0

[models.fast]
provider = "minimax"
model = "MiniMax-M2.7-highspeed"
max_context_tokens = 128000
supports_tool_call = true
# input_price_per_mtok = 0.1
# output_price_per_mtok = 0.4

[models.deep-reasoner]
provider = "zhipu"
model = "glm-5.1"
max_context_tokens = 200000
supports_tool_call = true
supports_reasoning = true

[models.vision]
provider = "zhipu"
model = "glm-4v"
max_context_tokens = 128000
supports_vision = true
supports_tool_call = true

# Model levels: level name -> model library entry ([models] key). Levels are
# what agents reference; here each level points at a same-named entry, which
# keeps this fixture compatible with both the legacy layout (each [models]
# key IS the alias) and the new two-layer schema.
[levels]
main = "main"
fast = "fast"

[trace]
enabled = true
store_sqlite = true
default_export_format = "chrome-json"

# MCP (Model Context Protocol) servers — external tool providers connected at
# startup. Each server's tools are auto-registered into the tool registry.
[mcp.servers.filesystem]
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

[mcp.servers.remote]
transport = "http"
url = "http://localhost:8000/mcp"

# Programmatic Tool Calling (PTC) — disabled by default. See PTC_PLAN.md.
# Numeric floors (enforced at load + validate): timeout_ms >= 100,
# memory_limit_bytes >= 1048576, max_output_bytes >= 1024,
# max_tool_calls_per_run >= 1, max_lookup_calls >= 1 (max_list_chars 0 = unlimited).
# [ptc]
# enabled = true
# timeout_ms = 60000
# memory_limit_bytes = 67108864
# max_output_bytes = 65536
# max_tool_calls_per_run = 16
# max_list_chars = 8000
# disclosure = "auto"                # full | catalog | auto (see PTC_PLAN.md §5.2)
# max_lookup_calls = 50              # list_tools/describe_tool budget per run_code
# [ptc.tool_modes]
# "*" = "both"
# "shell" = "direct"
# "github_*" = "ptc"

# Tool approval gating. policy: "auto" (default, approve everything) |
# "manual" (ask before every tool) | "auto_except" (ask only for `tools`).
# Interactive sessions (REPL) prompt y/n/a; non-interactive runs deny
# high-risk tools under manual/auto_except unless --yes forces auto.
# Validation warns when auto_except has an empty tools list or a tool name
# that matches no known tool.
# [approval]
# policy = "auto_except"
# tools = ["shell", "run_code"]

# TUI frontend — per-slot icon glyph overrides (icons-4). Any default
# codepoint table bets against some user's font; override just the
# slots your font misses (stacks on the --icons tier). Keys are
# IconSet field names (branch/brand/thinking/...); unknown keys or
# empty values are ignored with a startup warning. Values may be
# multi-char; TOML \uXXXX escapes or literal glyphs both work.
# [tui.icons.overrides]
# branch = "\uF418"   # Nerd Font PUA via escape (nf-oct-git_branch)
# brand = "★"         # literal glyph works too
