[workspace]
resolver = "2"
members = [
    "crates/openslate-core",
    "crates/openslate-store-sqlite",
    "crates/openslate-model-genai",
    "crates/openslate-app",
    "crates/openslate-cli",
    "crates/openslate-tui",
    "crates/openslate-mcp-builtin",
    "crates/openslate-ptc",
    "crates/openslate-protocol",
    "crates/openslate-server",
    "crates/openslate-session",
    "crates/openslate-mobile",
    "crates/openslate-mobile-ffi",
]
# vendor 补丁目录不是成员：独立测试在 vendor/genai 内跑（那里的 Cargo.toml
# 带自己的 [workspace] 表，见 vendor/genai 内说明）。
exclude = ["vendor/genai"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime ("signal" drives the CLI's Ctrl-C cancellation, Phase 4)
tokio = { version = "1.51", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "signal"] }

# Cancellation tokens for graceful Ctrl-C shutdown (threaded into execute_run, Phase 4)
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.148"
# serde_yaml fork lineage: serde_yml (RUSTSEC-2025-0068, unmaintained) →
# serde_norway, the maintained drop-in successor.
serde_norway = "0.9"
toml = "0.9"
# Format-preserving TOML editing (config/persist.rs upserts — comments and
# layout survive round-trips). Defaults (parse+display) suffice.
toml_edit = "0.25"

# Error handling
thiserror = "2.0.17"
anyhow = "1.0.101"

# Logging / Tracing
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# TUI frontend (openslate-tui, P2b). ratatui is pinned EXACTLY (=0.30.2): the
# patch carries the CJK wide-cell trailing-style fix (#2585) and crossterm
# must stay aligned with ratatui's backend version (else double event queues
# / broken terminal state); event-stream enables the async EventStream, driven
# via tokio-stream's StreamExt.
ratatui = "=0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio-stream = "0.1"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }

# MCP (Model Context Protocol). Client role + stdio/HTTP transports for
# external servers, plus server role + macros for the in-process builtin
# servers (openslate-mcp-builtin). base64 defaults still excluded. reqwest tls
# feature stays rustls-only (see transport-streamable-http-client-reqwest:
# pulls __reqwest w/o tls feature).
rmcp = { version = "3.5", default-features = false, features = ["client", "server", "macros", "transport-child-process", "transport-streamable-http-client-reqwest"] }

# SQLite (async)
# default-features=false：仅 sqlite 后端（仓库本就只用 sqlite；默认特性
# 会拉 postgres/mysql 门面——本机网络拉不齐其 .crate，且产物冗余）。
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }

# Async trait
async-trait = "0.1"

# Async primitives (channels etc. for in-process MCP transports)
futures = "0.3"

# HTTP+WS server (web-1: openslate-server). axum 0.8 with ws for the
# single full-protocol channel /api/ws; REST handlers share the router.
axum = { version = "0.8", features = ["ws"] }

# WS client for server integration tests (真 listener 连接).
tokio-tungstenite = "0.28"

# Embedded QuickJS sandbox for Programmatic Tool Calling (openslate-ptc).
# Sync runtime usage only (default features); see PTC_PLAN.md §6.
rquickjs = { version = "0.12.2", default-features = false, features = ["std"] }

# Workspace-internal crates
openslate-ptc = { path = "crates/openslate-ptc" }

# Testing
mockito = "1"

# Utilities
uuid = { version = "1.23.0", features = ["v4"] }
chrono = { version = "0.4.43", features = ["serde"] }
sha2 = "0.11"
dirs = "6"
indicatif = "0.18"
tempfile = "3.22"
futures-util = "0.3"

[patch.crates-io]
# 本机网络对 crates CDN（rsproxy/static.crates.io）拉 askama 系列长期
# TLS 失败；askama 0.16.1 源自 GitHub（可达）同版本 git 源补齐。
# 版本与 crates.io 一致（tag v0.16.1），无行为差异；网络恢复后可移除。
askama = { git = "https://github.com/askama-rs/askama.git", tag = "v0.16.1" }
askama_derive = { git = "https://github.com/askama-rs/askama.git", tag = "v0.16.1" }
askama_macros = { git = "https://github.com/askama-rs/askama.git", tag = "v0.16.1" }
askama_parser = { git = "https://github.com/askama-rs/askama.git", tag = "v0.16.1" }
# rquickjs-sys 0.12.2 未随包发布 aarch64-linux-android 绑定（Android 编译
# 硬失败）；vendor 副本补充了该绑定（照抄 gnu 版，quickjs 为纯 C ABI，
# 二进制布局一致）。上游合入后可移除。
rquickjs-sys = { path = "vendor/rquickjs-sys" }
# genai 0.6.5 vendor：anthropic adapter 原本丢弃历史 ReasoningContent——
# patch 为回传 thinking block（多轮 extended-thinking 语义）。
genai = { path = "vendor/genai" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Android cdylib（libopenslate_mobile.so）：FFI 边界必须可 unwind——
# panic=abort 下 Rust panic 穿越 extern "C" 是 UB，且 ffi 层的
# catch_unwind 防线依赖 unwind。其余优化与 release 一致。
[profile.mobile]
inherits = "release"
panic = "unwind"
