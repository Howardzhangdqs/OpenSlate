[package]
name = "openslate-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openslate"
path = "src/main.rs"

[features]
# Terminal markdown rendering for model output (termimad prose + syntect
# fenced-code highlighting). Off by default: the default build prints model
# output verbatim on TTY too (the historical non-TTY behavior) and drops the
# syntect static syntax/theme tables from the binary (~0.6 MiB).
markdown = ["dep:syntect", "dep:termimad"]

[dependencies]
openslate-core = { path = "../openslate-core" }
openslate-store-sqlite = { path = "../openslate-store-sqlite" }
# Shared application wiring (config/store/agents/skills/MCP/RunManager
# assembly + provider construction + approval policy derivation), extracted
# from this crate's former `wiring` module in P2a.
openslate-app = { path = "../openslate-app" }
# web-1: `openslate serve` 子命令转发（server 装配在本 crate 外）。
openslate-server = { path = "../openslate-server" }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
rustyline = "18"
indicatif = { workspace = true }
# Local-time formatting for the tracing timestamp.
chrono = { workspace = true }
# Markdown → ANSI rendering for model output on stdout (behind the `markdown`
# feature). No Ratatui dependency; coexists with indicatif (spinner) and
# rustyline (REPL input).
termimad = { version = "0.35", optional = true }
# Syntax highlighting for fenced code blocks (the engine `bat` uses). Pure-Rust
# build (fancy-regex, no oniguruma C dep) to match the project's no-native-deps
# (rustls) philosophy. Behind the `markdown` feature.
syntect = { version = "5", optional = true, default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[dev-dependencies]
tempfile = { workspace = true }
# Implementing ModelProvider for scripted test providers (compact summary
# path tests).
async-trait = { workspace = true }
